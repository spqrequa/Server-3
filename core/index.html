<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e14;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: #131820;
            border-radius: 16px;
            border: 1px solid #21262d;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .error-code {
            font-size: 6em;
            font-weight: bold;
            color: #f85149;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(248, 81, 73, 0.3);
        }
        .error-message {
            color: #8b949e;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        .error-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .back-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔒</div>
        <div class="error-code">404</div>
        <h2>Acceso Denegado</h2>
        <p class="error-message">No tienes permisos para acceder a esta sección.</p>
        <p class="error-message" style="font-size:0.8em; color:#f85149;">Directorio protegido por CryptoPalace Security</p>
        <a href="/Server-3/index.html" class="back-btn">Volver al Casino</a>
    </div>
</body>
</html>
